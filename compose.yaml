# bluelink-mcp for Hyundai Bluelink and Kia Connect (set BLUELINK_BRAND=kia for a Kia).
# Copy example.env to .env and fill it in, then: docker compose up -d
services:
  bluelink-mcp:
    image: ghcr.io/mattoddie/bluelink-mcp:latest
    # To build from source instead of pulling, replace the line above with:
    # build: .
    container_name: bluelink-mcp
    restart: unless-stopped
    env_file: .env
    ports:
      # Reachable from other machines. If clients run on this host or reach it through
      # a reverse proxy here, publish on loopback only instead: "127.0.0.1:8080:8080"
      - "8080:8080"
    volumes:
      # Keeps the login token across restarts, to avoid repeated logins.
      - bluelink-data:/data

volumes:
  bluelink-data:
