name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Check docs/tools.md is up to date
        run: uv run python scripts/gen_tool_docs.py --check
      - name: Check mcpb/manifest.json is up to date
        run: uv run python scripts/mcpb.py manifest --check

  mcpb:
    name: MCP Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Build
        run: uv run python scripts/mcpb.py pack 0.0.0+ci

      - name: Validate the manifest
        run: |
          mkdir -p .build/unpacked
          unzip -q dist/bluelink-mcp-0.0.0+ci.mcpb -d .build/unpacked
          npx -y @anthropic-ai/mcpb@2.1.2 validate .build/unpacked/manifest.json
          (cd .build/unpacked && uv lock --check --offline)

      - name: Smoke test (over stdio, run the way the manifest says)
        working-directory: .build/unpacked
        # Set every variable the way Claude Desktop does when the optional settings are left empty.
        env:
          MCP_TRANSPORT: stdio
          BLUELINK_USERNAME: ci@example.com
          BLUELINK_PASSWORD: ci
          BLUELINK_PIN: '${user_config.pin}' # an unfilled setting, passed through literally
          BLUELINK_REGION: europe
          BLUELINK_BRAND: hyundai
          BLUELINK_ALLOW_WRITES: "false"
          BLUELINK_ALLOW_UNLOCK: "false"
          BLUELINK_ALLOW_LOCATION: "false"
          BLUELINK_AUDIT_LOG: ""
        run: |
          mapfile -t args < <(jq -r '.server.mcp_config.args[] | sub("\\$\\{__dirname\\}"; env.PWD)' manifest.json)
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 5
          } | uv "${args[@]}" > out.jsonl
          jq -c '{id, server: .result.serverInfo, tools: (.result.tools | length?)}' out.jsonl
          test "$(jq -rs 'map(select(.id == 1))[0].result.serverInfo.version' out.jsonl)" = 0.0.0+ci
          tools=$(jq -s 'map(select(.id == 2))[0].result.tools | length' out.jsonl)
          test "$tools" -gt 0

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      # Checks every package in uv.lock (with its hashes) against the PyPI and OSV advisories.
      - name: pip-audit
        run: |
          uv export --locked --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: bluelink-mcp:ci
          build-args: VERSION=0.0.0+ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          token=$(openssl rand -hex 16)
          docker run -d --name smoke -p 8080:8080 \
            -e BLUELINK_USERNAME=ci@example.com -e BLUELINK_PASSWORD=ci -e MCP_AUTH_TOKEN="$token" \
            bluelink-mcp:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          echo
          tools=$(curl -fsS -X POST http://localhost:8080/mcp \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | sed -n 's/^data: //; /^{/p' | jq '.result.tools | length')
          echo "Tools registered: $tools"
          test "$tools" -gt 0
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/mcp -d '{}')
          test "$code" = 401
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/mcp -H "Authorization: Bearer $token")
          test "$code" = 405
          docker exec smoke bluelink-mcp healthcheck
          docker logs smoke
          docker rm -f smoke

      - name: Build all platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=0.0.0+ci
          cache-from: type=gha
