# Pushing a version tag (vX.Y.Z) creates a draft GitHub release, builds the
# Docker image for amd64 and arm64 and pushes it to ghcr.io/<owner>/bluelink-mcp,
# attaches the MCP Bundle (.mcpb) for Claude Desktop, the wheel and a hash-locked
# requirements file to the draft, then publishes
# the release. Releases are immutable once published, so everything is attached
# first. Stable releases are then published to the MCP Registry. See
# docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  prepare:
    name: Create the draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the draft release
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - name: Validate tag
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must be semantic versions like v1.2.3 or v1.2.3-rc.1 (got '$TAG')."
            exit 1
          fi
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Stable releases get the moving tags (X.Y, X, latest); pre-releases only their exact version.
          if [[ "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points to $GITHUB_SHA, which isn't on main. Tag a commit on main."
            exit 1
          fi

      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ steps.version.outputs.stable }}
        run: |
          # A re-run finds the release this workflow already created.
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .draft")
          if [[ -z "$draft" ]]; then
            prerelease=()
            [[ "$STABLE" == "true" ]] || prerelease=(--prerelease)
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "$TAG" --generate-notes "${prerelease[@]}"
            draft=true
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          if [[ "$draft" != "true" ]]; then
            echo "::notice::$TAG is already published, so its assets can't change. Rebuilding the image only."
          fi

  image:
    name: Build and push image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write # append image details to the release notes
      packages: write # push to ghcr.io
      id-token: write # sign the build provenance attestation
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Version
        id: version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ steps.version.outputs.stable }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ steps.version.outputs.stable == 'true' && !startsWith(env.TAG, 'v0.') }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable }}
          labels: |
            org.opencontainers.image.title=bluelink-mcp
            org.opencontainers.image.description=MCP server for Hyundai Bluelink and Kia Connect
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=bluelink-mcp
            org.opencontainers.image.description=MCP server for Hyundai Bluelink and Kia Connect
            org.opencontainers.image.licenses=MIT
            io.modelcontextprotocol.server.name=io.github.mattoddie/bluelink-mcp

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          # No build cache: release images are built from scratch so nothing cached
          # by another workflow run can end up in a published image.
          no-cache: true
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Add image details to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          # Re-running the workflow must not add the section twice.
          if grep -q '^## Container image' notes.md; then
            exit 0
          fi
          {
            echo
            echo "## Container image"
            echo
            echo '```sh'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\` · Digest: \`$DIGEST\`"
            echo
            echo "Tags: $(echo "$TAGS" | sed 's/.*:/`/; s/$/`/' | paste -sd ' ' | sed 's/ /, /g')"
          } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published \`$IMAGE:$VERSION\`"
            echo
            echo "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  mcpb:
    name: Build and upload the MCP Bundle and Python package
    # After the image: the tests run inside its build.
    needs: [prepare, image]
    # A published release is immutable, so a re-run can't replace its bundle.
    if: needs.prepare.outputs.draft == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the release assets and append to the release notes
      id-token: write # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # No cache, for the same reason as the image.
          enable-cache: false
      - run: uv sync --locked

      - name: Build
        run: |
          version="${TAG#v}"
          uv run python scripts/mcpb.py pack "$version"
          # The wheel and a hash-locked list of its dependencies, for installing without Docker
          # or Claude Desktop (the Homebrew formula uses these).
          uv version --frozen "$version"
          uv build --wheel --out-dir dist
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            -o "dist/bluelink-mcp-$version-requirements.txt"
          (cd dist && sha256sum *.mcpb *.whl *-requirements.txt > SHA256SUMS)

      - name: Check the Python package
        run: |
          version="${TAG#v}"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r "dist/bluelink-mcp-$version-requirements.txt"
          # Python normalises the version in the wheel's name (1.2.3-rc.1 becomes 1.2.3rc1).
          wheel=$(ls dist/bluelink_mcp-*-py3-none-any.whl)
          wheel_version=${wheel#dist/bluelink_mcp-}
          wheel_version=${wheel_version%-py3-none-any.whl}
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps "$wheel"
          test "$("$RUNNER_TEMP/venv/bin/bluelink-mcp" version)" = "$wheel_version"
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Validate the manifest
        run: |
          mkdir -p .build/unpacked
          unzip -q "dist/bluelink-mcp-${TAG#v}.mcpb" -d .build/unpacked
          npx -y @anthropic-ai/mcpb@2.1.2 validate .build/unpacked/manifest.json
          test "$(jq -r .version .build/unpacked/manifest.json)" = "${TAG#v}"
          (cd .build/unpacked && uv lock --check --offline)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.mcpb
            dist/*.whl
            dist/*-requirements.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          wheel=$(basename dist/bluelink_mcp-*-py3-none-any.whl)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*.mcpb dist/*.whl dist/*-requirements.txt dist/SHA256SUMS --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          # Re-running the workflow must not add the section twice.
          if grep -q '^## Claude Desktop' notes.md; then
            exit 0
          fi
          {
            echo
            echo "## Claude Desktop"
            echo
            echo "Download \`bluelink-mcp-$version.mcpb\` and open it to install bluelink-mcp as a Claude Desktop extension. One bundle works on macOS, Windows and Linux: Claude Desktop installs Python and the dependencies with uv. See [Claude Desktop](https://bluelink-mcp.mattoddie.dev/docs/clients/#claude-desktop) for the settings."
            echo
            echo "## Without Docker"
            echo
            echo "Install with [Homebrew](https://github.com/mattoddie/homebrew-tap) on macOS or Linux: \`brew install mattoddie/tap/bluelink-mcp\`. Or install the wheel and its hash-locked dependencies into a virtualenv with Python 3.12 or later: \`pip install --require-hashes -r bluelink-mcp-$version-requirements.txt\`, then \`pip install --no-deps $wheel\`. See [Running without Docker](https://bluelink-mcp.mattoddie.dev/docs/deployment/#running-without-docker)."
          } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  publish:
    name: Publish the release
    needs: [prepare, image, mcpb]
    if: needs.prepare.outputs.draft == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # publish the draft release
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  registry:
    name: Publish to the MCP Registry
    # After the release is published, with the image and the bundle that server.json points at. Pre-releases aren't listed.
    needs: [prepare, image, publish]
    # On a re-run of an already published release, publish is skipped and this still runs.
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.stable == 'true' && needs.image.result == 'success' &&
      (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.prepare.outputs.draft != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # download the bundle to hash it
      id-token: write # log in to the registry with GitHub OIDC
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Pinned: bump both together from the release's registry_<version>_checksums.txt.
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --help > /dev/null

      - name: Stamp the version, image tag and bundle hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hash the bundle that was actually uploaded to the release.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "bluelink-mcp-$VERSION.mcpb" --dir "$RUNNER_TEMP"
          sha=$(sha256sum "$RUNNER_TEMP/bluelink-mcp-$VERSION.mcpb" | cut -d' ' -f1)
          python3 scripts/registry.py stamp "$VERSION" "$sha"
          cat server.json

      - name: Validate
        run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'

      - name: Publish
        run: |
          # The registry refuses to publish a version twice, so a re-run after
          # a successful publish has nothing to do.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/$(jq -r '.name | @uri' server.json)/versions/$VERSION")
          if [ "$code" = 200 ]; then
            echo "Version $VERSION is already in the MCP Registry."
            exit 0
          fi
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
          {
            echo "### Published \`io.github.mattoddie/bluelink-mcp\` $VERSION to the MCP Registry"
            echo
            echo "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.mattoddie/bluelink-mcp"
          } >> "$GITHUB_STEP_SUMMARY"
