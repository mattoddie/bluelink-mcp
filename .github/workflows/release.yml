# Publishing a GitHub release (tag vX.Y.Z) builds the Docker image for
# amd64 and arm64, pushes it to ghcr.io/<owner>/bluelink-mcp, and attaches the
# MCP Bundle (.mcpb) for Claude Desktop to the release. Stable releases are then
# published to the MCP Registry. See docs/releasing.md.
name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: write # append image details to the release notes
      packages: write # push to ghcr.io
      id-token: write # sign the build provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate tag
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must be semantic versions like v1.2.3 or v1.2.3-rc.1 (got '$TAG')."
            exit 1
          fi
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Stable releases get the moving tags (X.Y, X, latest); pre-releases only their exact version.
          if [[ "$version" == *-* || "${{ github.event.release.prerelease }}" == "true" ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ steps.version.outputs.stable }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ steps.version.outputs.stable == 'true' && !startsWith(env.TAG, 'v0.') }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable }}
          labels: |
            org.opencontainers.image.title=bluelink-mcp
            org.opencontainers.image.description=MCP server for Hyundai Bluelink and Kia Connect
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=bluelink-mcp
            org.opencontainers.image.description=MCP server for Hyundai Bluelink and Kia Connect
            org.opencontainers.image.licenses=MIT
            io.modelcontextprotocol.server.name=io.github.mattoddie/bluelink-mcp

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          # No build cache: release images are built from scratch so nothing cached
          # by another workflow run can end up in a published image.
          no-cache: true
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Add image details to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          {
            echo
            echo "## Container image"
            echo
            echo '```sh'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\` · Digest: \`$DIGEST\`"
            echo
            echo "Tags: $(echo "$TAGS" | sed 's/.*:/`/; s/$/`/' | paste -sd ' ' | sed 's/ /, /g')"
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published \`$IMAGE:$VERSION\`"
            echo
            echo "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  mcpb:
    name: Build and upload the MCP Bundle
    # After the image: that job validates the tag, and the tests run inside its build.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the release asset and append to the release notes
      id-token: write # sign the build provenance attestation
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # No cache, for the same reason as the image.
          enable-cache: false
      - run: uv sync --locked

      - name: Build
        run: uv run python scripts/mcpb.py pack "${TAG#v}"

      - name: Validate the manifest
        run: |
          mkdir -p .build/unpacked
          unzip -q "dist/bluelink-mcp-${TAG#v}.mcpb" -d .build/unpacked
          npx -y @anthropic-ai/mcpb@2.1.2 validate .build/unpacked/manifest.json
          test "$(jq -r .version .build/unpacked/manifest.json)" = "${TAG#v}"
          (cd .build/unpacked && uv lock --check --offline)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.mcpb

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release upload "$TAG" dist/*.mcpb --clobber
          gh release view "$TAG" --json body --jq .body > notes.md
          # Re-running the workflow must not add the section twice.
          if grep -q '^## Claude Desktop' notes.md; then
            exit 0
          fi
          {
            echo
            echo "## Claude Desktop"
            echo
            echo "Download \`bluelink-mcp-$version.mcpb\` and open it to install bluelink-mcp as a Claude Desktop extension. One bundle works on macOS, Windows and Linux: Claude Desktop installs Python and the dependencies with uv. See [Claude Desktop](https://bluelink-mcp.mattoddie.dev/docs/clients/#claude-desktop) for the settings."
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md

  registry:
    name: Publish to the MCP Registry
    # After the image and the bundle, which server.json points at. Pre-releases aren't listed.
    needs: [image, mcpb]
    if: needs.image.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # download the bundle to hash it
      id-token: write # log in to the registry with GitHub OIDC
    env:
      TAG: ${{ github.event.release.tag_name }}
      VERSION: ${{ needs.image.outputs.version }}
      # Pinned: bump both together from the release's registry_<version>_checksums.txt.
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --help > /dev/null

      - name: Stamp the version, image tag and bundle hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hash the bundle that was actually uploaded to the release.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "bluelink-mcp-$VERSION.mcpb" --dir "$RUNNER_TEMP"
          sha=$(sha256sum "$RUNNER_TEMP/bluelink-mcp-$VERSION.mcpb" | cut -d' ' -f1)
          python3 scripts/registry.py stamp "$VERSION" "$sha"
          cat server.json

      - name: Validate
        run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'

      - name: Publish
        run: |
          # The registry refuses to publish a version twice, so a re-run after
          # a successful publish has nothing to do.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/$(jq -r '.name | @uri' server.json)/versions/$VERSION")
          if [ "$code" = 200 ]; then
            echo "Version $VERSION is already in the MCP Registry."
            exit 0
          fi
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
          {
            echo "### Published \`io.github.mattoddie/bluelink-mcp\` $VERSION to the MCP Registry"
            echo
            echo "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.mattoddie/bluelink-mcp"
          } >> "$GITHUB_STEP_SUMMARY"
