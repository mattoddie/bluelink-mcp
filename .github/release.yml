# Categories for GitHub's auto-generated release notes, based on PR labels.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: ⚠️ Breaking changes
      labels: [breaking]
    - title: ✨ New features
      labels: [enhancement, new-tool]
    - title: 🐛 Bug fixes
      labels: [bug]
    - title: 📡 Compatibility
      labels: [compatibility]
    - title: 📚 Documentation
      labels: [documentation]
    - title: 📦 Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
